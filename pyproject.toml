[project]
name = "browser-use-pydantic"
version = "0.2.0"
description = "Browser Use on Pydantic AI: one persistent Python REPL tool on raw CDP"
authors = [
    { name = "Gregor Žunič", email = "36313686+gregpr07@users.noreply.github.com" }
]
requires-python = ">=3.12"
license = "MIT"
readme = "README.md"
dependencies = [
    "browser-harness>=0.1.13",
    "pydantic-ai-slim[openai]>=2.64.0",
]

[project.urls]
Homepage = "https://github.com/browser-use/browser-use-pydantic"

[project.optional-dependencies]
eval = [
    "lmnr>=0.8.6",
    "openpyxl==3.1.5",
    "pypdf==6.14.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
browser-harness = { git = "https://github.com/browser-use/browser-harness", rev = "0727ae7" }

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/eval", "/README.md", "/LICENSE", "/pyproject.toml"]
